name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bt-signal-meter-win-x64
          path: dist/
